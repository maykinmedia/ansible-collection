---
# Deploys one container for each requested version of the assets.

- name: Install dependencies
  ansible.builtin.package:
    name: python3-docker
    state: present

- name: Provision the isolated app container network
  community.docker.docker_network:
    name: "{{ theme_assets_docker_name_prefix }}"
    internal: "{{ theme_assets_docker_network_internal }}"

- name: Check if app containers already exists
  community.docker.docker_container_info:
    name: "{{ theme_assets_docker_name_prefix }}-{{ item }}"
  loop: "{{ theme_assets_docker_versions | mandatory }}"
  register: _theme_assets_docker_container_info

# An empty string means the version needs a new port: either the container doesn't
# exist, or it has no fixed host port. In the latter case docker assigns a random
# port on every start, so the port drifts away from the nginx upstream after a restart.
- name: Get the current host port of each version
  ansible.builtin.set_fact:
    _theme_assets_docker_current_ports: >-
      {{ _theme_assets_docker_container_info.results
      | map(attribute='container.HostConfig.PortBindings.8080/tcp.0.HostPort', default='')
      | list }}

- name: Warn about containers without a fixed host port
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ theme_assets_docker_name_prefix }}-{{ item }} has no fixed host port.
      It will be recreated with a newly allocated port.
  loop: "{{ theme_assets_docker_versions }}"
  loop_control:
    index_var: index
  when:
    - _theme_assets_docker_container_info.results[index].exists
    - not _theme_assets_docker_current_ports[index]

- name: Determine whether any version needs a newly allocated port
  ansible.builtin.set_fact:
    _theme_assets_docker_needs_new_ports: "{{ '' in _theme_assets_docker_current_ports }}"

# The port allocation lock is only acquired/held around the free-port scan and the
# container creation below, and only when at least one version doesn't exist yet
# or has no fixed host port.
# Redeploys of already-existing versions reuse their current port (see
# ports.yml.j2) and never contend for the lock. The lock is released in `always`
# so a failed container creation can't leave it stuck.
- name: Allocate ports and run the app containers
  block:
    - name: Acquire port allocation lock
      ansible.builtin.import_role:
        name: portlock
        tasks_from: acquire
      vars:
        portlock_retries: "{{ theme_assets_docker_portlock_retries }}"
        portlock_delay: "{{ theme_assets_docker_portlock_delay }}"
        portlock_max_age: "{{ theme_assets_docker_portlock_max_age }}"
      when: _theme_assets_docker_needs_new_ports

    - name: Get target machine free ports
      ansible.builtin.import_tasks: freeports.yml
      when: _theme_assets_docker_needs_new_ports

    # For each container, either take the port on which it is running or take one of the free ports
    - name: Make list of ports for the containers
      ansible.builtin.set_fact:
        _app_container_ports: "{{ lookup('template', 'ports.yml.j2') | from_yaml }}"

    - name: Run the app containers
      community.docker.docker_container:
        container_default_behavior: no_defaults
        name: "{{ theme_assets_docker_name_prefix }}-{{ item }}"
        image: "{{ theme_assets_docker_image_registry }}/{{ theme_assets_docker_image_name | mandatory }}:{{ item }}"
        hostname: "{{ theme_assets_docker_name_prefix }}-{{ item }}"
        state: "{{ theme_assets_docker_state }}"
        pull: "{{ theme_assets_docker_image_always_pull or item == 'latest' }}"
        restart: false
        restart_policy: always
        networks:
          - name: "{{ theme_assets_docker_name_prefix }}"
        networks_cli_compatible: true

        healthcheck: "{{ theme_assets_docker_healthcheck | default({}) }}"

        privileged: false
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "10"

        memory: "{{ theme_assets_docker_memory_limit }}"
        memory_swap: "{{ theme_assets_docker_swap_memory_limit }}"
        cpus: "{{ theme_assets_docker_cpus }}"

        published_ports:
          - "127.0.0.1:{{ _app_container_ports[index] }}:8080"
        comparisons:
          env: strict
          volumes: strict
          networks: strict
      loop: "{{ theme_assets_docker_versions }}"
      loop_control:
        index_var: index
      register: backend_ports
  always:
    - name: Release port allocation lock
      ansible.builtin.import_role:
        name: portlock
        tasks_from: release
      when: _theme_assets_docker_needs_new_ports
