---
# This playbook creates a lock simply by creating a certain directory on the host.
# If the directory exists, a concurrent run is blocked from selecting a free port.
#
# This guards the free-port scan and container creation against parallel deploys racing on the same host port.
# See: https://taiga.maykinmedia.nl/project/maykin-intranet/issue/1551
#
# There is also a check on the age of the lock. If it's older than theme_assets_docker_portlock_max_age, it is considered stale and invalid.
# A lock that's still there because the run that created it was killed before it could release it (crash, host reboot, ansible-playbook -9'd) would
# otherwise block every future deploy forever.
# There's no reliable way to check whether that run is still alive: Ansible creates a new process per task, so we cannot check on PID.
# So a simple age check will have to do.
#
# The owner's host and pid are still recorded, just in case anyone wants to see them.

- name: portlock_acquire | Get the current time on the target host
  ansible.builtin.command: date +%s
  register: _theme_assets_docker_portlock_now
  changed_when: false

- name: portlock_acquire | Read the current lock owner, if any
  ansible.builtin.slurp:
    src: "{{ theme_assets_docker_portlock_path }}/owner"
  register: _theme_assets_docker_portlock_owner_raw
  ignore_errors: true

- name: portlock_acquire | Extract the lock owner's age
  ansible.builtin.set_fact:
    _theme_assets_docker_portlock_owner_age: >-
      {{ (_theme_assets_docker_portlock_now.stdout | int) -
         (_theme_assets_docker_portlock_owner_raw.content | default('') | b64decode
          | regex_findall('acquired_at=([0-9]+)') | first | default(0) | int) }}

# A lock is considered stale (and is broken so the acquire below can proceed
# immediately) when its owner file is missing/unreadable, or it's simply
# older than the configured max age. This is also a harmless no-op when
# there's no lock at all yet.
- name: portlock_acquire | Break the lock if it looks stale
  ansible.builtin.file:
    path: "{{ theme_assets_docker_portlock_path }}"
    state: absent
  when: >-
    (_theme_assets_docker_portlock_owner_raw is failed)
    or (_theme_assets_docker_portlock_owner_age | default(0) | int > theme_assets_docker_portlock_max_age)

- name: portlock_acquire | Acquire port allocation lock
  ansible.builtin.command:
    cmd: "mkdir {{ theme_assets_docker_portlock_path }}"
  register: _theme_assets_docker_portlock_acquire
  until: _theme_assets_docker_portlock_acquire is succeeded
  retries: "{{ theme_assets_docker_portlock_retries }}"
  delay: "{{ theme_assets_docker_portlock_delay }}"
  changed_when: true

- name: portlock_acquire | Record lock ownership (controller host, pid and timestamp)
  ansible.builtin.copy:
    dest: "{{ theme_assets_docker_portlock_path }}/owner"
    mode: "0600"
    content: |
      host={{ lookup('pipe', 'hostname') }}
      pid={{ lookup('pipe', 'echo $PPID') }}
      acquired_at={{ _theme_assets_docker_portlock_now.stdout }}
