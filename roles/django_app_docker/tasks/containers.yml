---
# https://docs.ansible.com/ansible/devel/reference_appendices/faq.html#when-is-it-unsafe-to-bulk-set-task-arguments-from-a-variable
#
# This should be safe since we use a lookup which renders a template, rather than
# accepting host facts.

- name: "containers | Run the cache/broker service"
  community.docker.docker_container: "{{ lookup('template', 'redis-container.yml.j2') | from_yaml }}" # noqa: args[module]

- name: "containers | Run the rabbitmq message broker container"
  community.docker.docker_container: "{{ lookup('template', 'rabbitmq-container.yml.j2') | from_yaml }}" # noqa: args[module]
  when: django_app_docker_use_rabbitmq

- name: "containers | Run the elasticsearch container"
  community.docker.docker_container: "{{ lookup('template', 'elasticsearch-container.yml.j2') | from_yaml }}" # noqa: args[module]
  when: django_app_docker_use_elasticsearch

- name: "containers | Check if django containers already exists and register port"
  community.docker.docker_container_info:
    name: "{{ django_app_docker_name_prefix }}-{{ django_app_docker_counter }}"
  loop: "{{ range(django_app_docker_replicas) | list }}"
  loop_control:
    loop_var: django_app_docker_counter
  register: _django_app_docker_container_info

- name: "containers | Determine whether any django replica needs a newly allocated port"
  ansible.builtin.set_fact:
    _django_app_docker_needs_new_ports: "{{ _django_app_docker_container_info.results | selectattr('exists', 'equalto', false) | list | length > 0 }}"

# The port allocation lock is only acquired/held around the free-port scan and the
# container creation below, and only when at least one replica doesn't exist yet.
# Redeploys of already-existing replicas reuse their current port (see
# replicas.yml.j2) and never contend for the lock. The lock is released in
# `always` so a failed container creation can't leave it stuck.
- name: "containers | Allocate ports and run the django backend containers"
  block:
    - name: containers | Acquire port allocation lock
      ansible.builtin.import_role:
        name: portlock
        tasks_from: acquire
      vars:
        portlock_retries: "{{ django_app_docker_portlock_retries }}"
        portlock_delay: "{{ django_app_docker_portlock_delay }}"
        portlock_max_age: "{{ django_app_docker_portlock_max_age }}"
      when: _django_app_docker_needs_new_ports

    - name: containers | Get target machine free ports
      ansible.builtin.import_tasks: freeports.yml
      when: _django_app_docker_needs_new_ports

    - name: "containers | Determine the replicas"
      ansible.builtin.set_fact:
        _django_app_docker_replicas: "{{ lookup('template', 'replicas.yml.j2') | from_yaml }}"

    - name: "containers | Run the django backend containers"
      community.docker.docker_container: "{{ lookup('template', 'django-container.yml.j2') | from_yaml }}" # noqa: args[module]
      loop: "{{ _django_app_docker_replicas }}"
      loop_control:
        loop_var: django_app_docker_replica
        pause: "{{ django_app_docker_replicas_loop_pause }}"
      register: backend_ports
  always:
    - name: containers | Release port allocation lock
      ansible.builtin.import_role:
        name: portlock
        tasks_from: release
      when: _django_app_docker_needs_new_ports

- name: "containers | Get the port of the first replica before flower overwrites it"
  ansible.builtin.set_fact:
    _django_app_docker_port: "{{ _django_app_docker_replicas[0].port }}"

- name: "containers | Determine the celery worker replicas"
  ansible.builtin.set_fact:
    _django_app_docker_celery_worker_replicas: "{{ lookup('template', 'celery-replicas.yml.j2') | from_yaml }}"
  when: django_app_docker_use_celery

- name: "containers | Run the celery worker containers"
  community.docker.docker_container: "{{ lookup('template', 'celery-worker-container.yml.j2') | from_yaml }}" # noqa: args[module]
  loop: "{{ _django_app_docker_celery_worker_replicas }}"
  loop_control:
    loop_var: django_app_docker_celery_replica
  when: django_app_docker_use_celery

- name: "containers | Run the celery monitor container"
  community.docker.docker_container: "{{ lookup('template', 'celery-monitor-container.yml.j2') | from_yaml }}" # noqa: args[module]
  when: django_app_docker_use_celery_monitor

- name: "containers | Run the celery beat container"
  community.docker.docker_container: "{{ lookup('template', 'celery-beat-container.yml.j2') | from_yaml }}" # noqa: args[module]
  when: django_app_docker_use_celery_beat

- name: "containers | Check if flower containers already exists and register port if exists"
  community.docker.docker_container_info:
    name: "{{ django_app_docker_name_prefix }}-flower"
  register: _django_app_docker_container_info_flower

- name: "containers | Determine whether the flower container needs a newly allocated port"
  ansible.builtin.set_fact:
    _django_app_docker_flower_needs_new_port: "{{ django_app_docker_use_flower and not _django_app_docker_container_info_flower.exists }}"

- name: "containers | Allocate a port and run the celery flower container"
  block:
    - name: containers | Acquire port allocation lock
      ansible.builtin.import_role:
        name: portlock
        tasks_from: acquire
      vars:
        portlock_retries: "{{ django_app_docker_portlock_retries }}"
        portlock_delay: "{{ django_app_docker_portlock_delay }}"
        portlock_max_age: "{{ django_app_docker_portlock_max_age }}"
      when: _django_app_docker_flower_needs_new_port

    - name: "containers | When no flower container found, recheck free ports"
      ansible.builtin.import_tasks: freeports.yml
      when: _django_app_docker_flower_needs_new_port

    - name: "containers | Run the celery flower container"
      community.docker.docker_container: "{{ lookup('template', 'celery-flower-container.yml.j2') | from_yaml }}" # noqa: args[module]
      when: django_app_docker_use_flower
      register: flower_ports
  always:
    - name: containers | Release port allocation lock
      ansible.builtin.import_role:
        name: portlock
        tasks_from: release
      when: _django_app_docker_flower_needs_new_port
