---
# This playbook creates a lock simply by creating a certain directory on the host.
# If the directory exists, a concurrent run is blocked from selecting a free port.
#
# This guards the free-port scan and container creation against parallel deploys racing on the same host port.
# See: https://taiga.maykinmedia.nl/project/maykin-intranet/issue/1551
#
# There is also a check on the age of the lock. If it's older than django_app_docker_portlock_max_age, it is considered stale and invalid.
# A lock that's still there because the run that created it was killed before it could release it (crash, host reboot, ansible-playbook -9'd) would
# otherwise block every future deploy forever.
# There's no reliable way to check whether that run is still alive: Ansible creates a new process per task, so we cannot check on PID.
# So a simple age check will have to do.
#
# In the lock directory, there's an owner file containing the host and pid of whoever last ran a deployment playbook. Just in case anyone wants to see them.
#
# The age is based on the lock directory's own ctime rather than the "owner" file written just after it's created.
# That's because of a problem that surfaced during testing: we used to check the ctime of the owner file, but if two runs are started 
# right after each other, it can happen that the second run checks the lock just before the owner file is created by the first run. 
# In that case the second run considers the lock invalid and breaks it.
# This is fixed by using the ctime of the lock directory instead.

- name: portlock_acquire | Get the current time on the target host
  ansible.builtin.command: date +%s
  register: _django_app_docker_portlock_now
  changed_when: false

- name: portlock_acquire | Check the lock directory itself, if any
  ansible.builtin.stat:
    path: "{{ django_app_docker_portlock_path }}"
  register: _django_app_docker_portlock_stat

- name: portlock_acquire | Compute the lock's age
  ansible.builtin.set_fact:
    _django_app_docker_portlock_age: >-
      {{ (_django_app_docker_portlock_now.stdout | int) - (_django_app_docker_portlock_stat.stat.ctime | default(0) | int) }}

# A lock is considered stale when it's older than the configured max age.
# In that case, the lock is broken.
# This also works if there is no lock at all.
- name: portlock_acquire | Break the lock if it looks stale
  ansible.builtin.file:
    path: "{{ django_app_docker_portlock_path }}"
    state: absent
  when: >-
    _django_app_docker_portlock_stat.stat.exists
    and (_django_app_docker_portlock_age > django_app_docker_portlock_max_age | int)

- name: portlock_acquire | Acquire port allocation lock
  ansible.builtin.command:
    cmd: "mkdir {{ django_app_docker_portlock_path }}"
  register: _django_app_docker_portlock_acquire
  until: _django_app_docker_portlock_acquire is succeeded
  retries: "{{ django_app_docker_portlock_retries }}"
  delay: "{{ django_app_docker_portlock_delay }}"
  changed_when: true

- name: portlock_acquire | Record lock ownership (controller host, pid and timestamp)
  ansible.builtin.copy:
    dest: "{{ django_app_docker_portlock_path }}/owner"
    mode: "0600"
    content: |
      host={{ lookup('pipe', 'hostname') }}
      pid={{ lookup('pipe', 'echo $PPID') }}
      acquired_at={{ _django_app_docker_portlock_now.stdout }}
